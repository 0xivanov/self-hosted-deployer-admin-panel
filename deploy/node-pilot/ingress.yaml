apiVersion: v1
kind: Namespace
metadata:
  name: launchstead-sites
---
apiVersion: v1
kind: Service
metadata:
  name: node-demo
  namespace: launchstead-sites
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: launchstead-sites-node-demo@kubernetescrd
spec:
  ports:
    - name: https
      port: 8943
      targetPort: 8943
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-demo-vps
  namespace: launchstead-sites
  labels:
    kubernetes.io/service-name: node-demo
    endpointslice.kubernetes.io/managed-by: launchstead-sites-operator
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8943
endpoints:
  - addresses: ["10.8.0.1"]
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: node-demo
  namespace: launchstead-sites
spec:
  serverName: "node-demo.159-195-146-26.sslip.io"
  rootCAsSecrets:
    - node-demo-origin-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-demo
  namespace: launchstead-sites
  annotations:
    cert-manager.io/cluster-issuer: deployer-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: node-demo.159-195-146-26.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-demo
                port:
                  number: 8943
  tls:
    - hosts: [node-demo.159-195-146-26.sslip.io]
      secretName: node-demo-public-tls
