apiVersion: v1
kind: Namespace
metadata:
  name: launchstead-portal
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: launchstead-portal
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: launchstead-portal-customer-portal@kubernetescrd
spec:
  ports:
    - name: https
      port: 8791
      targetPort: 8791
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: customer-portal-vps
  namespace: launchstead-portal
  labels:
    kubernetes.io/service-name: customer-portal
    endpointslice.kubernetes.io/managed-by: launchstead-portal-operator
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8791
endpoints:
  - addresses: ["10.8.0.1"]
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: customer-portal
  namespace: launchstead-portal
spec:
  serverName: "portal.0xivanov.dev"
  rootCAsSecrets:
    - customer-portal-origin-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-portal
  namespace: launchstead-portal
  annotations:
    cert-manager.io/cluster-issuer: deployer-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: portal.0xivanov.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-portal
                port:
                  number: 8791
  tls:
    - hosts: [portal.0xivanov.dev]
      secretName: customer-portal-public-tls
