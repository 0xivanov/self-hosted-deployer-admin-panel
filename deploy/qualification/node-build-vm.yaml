# Synthetic Node build rehearsal only. Egress is not isolated for customer code.
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 10GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
portForwards:
  - guestPortRange: [1, 65535]
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
