apiVersion: v1
kind: Namespace
metadata:
  name: launchstead-sites
---
apiVersion: v1
kind: Service
metadata:
  name: testing-2
  namespace: launchstead-sites
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: launchstead-sites-testing-2@kubernetescrd
spec:
  ports:
    - name: https
      port: 8793
      targetPort: 8793
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: testing-2-vps
  namespace: launchstead-sites
  labels:
    kubernetes.io/service-name: testing-2
    endpointslice.kubernetes.io/managed-by: launchstead-sites-operator
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8793
endpoints:
  - addresses: ["10.8.0.1"]
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: testing-2
  namespace: launchstead-sites
spec:
  serverName: "testing-two.159-195-146-26.sslip.io"
  rootCAsSecrets:
    - testing-2-origin-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testing-2
  namespace: launchstead-sites
  annotations:
    cert-manager.io/cluster-issuer: deployer-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: testing-two.159-195-146-26.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testing-2
                port:
                  number: 8793
  tls:
    - hosts: [testing-two.159-195-146-26.sslip.io]
      secretName: testing-2-public-tls
