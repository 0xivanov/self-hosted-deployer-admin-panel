<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Node.js site is live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ff;color:#21203a;font:17px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:720px;width:100%;background:white;padding:clamp(28px,6vw,64px);border-radius:24px;box-shadow:0 24px 80px #36306715}.badge{display:inline-block;color:#126345;background:#e6f6ee;padding:5px 14px;border-radius:24px;font-size:14px;font-weight:600}h1{font-size:clamp(34px,6vw,56px);line-height:1.1;letter-spacing:-2px;margin:24px 0}p{color:#66647c}button{background:#6250d7;color:white;border:0;border-radius:12px;padding:14px 22px;font:inherit;cursor:pointer}button:hover{background:#4937bb}button:focus-visible{outline:3px solid #c3b8ff;outline-offset:4px}output{display:block;margin-top:16px;min-height:28px}footer{margin-top:42px;border-top:1px solid #eeedf6;padding-top:20px;font-size:14px;color:#79778b}
</style>
</head>
<body><main>
<span class="badge">Deployment successful</span>
<h1>Your Node.js<br>site is live.</h1>
<p>This page was uploaded, built in an isolated environment, and served by your Node.js application.</p>
<button id="counter" type="button">Try the demo</button>
<output id="result" aria-live="polite">Ready when you are.</output>
<footer>Edit this project, upload a new version, and deploy your next release.</footer>
</main><script>
let clicks=0;document.getElementById('counter').addEventListener('click',()=>{clicks++;document.getElementById('result').textContent=`It works! You've clicked ${clicks} ${clicks===1?'time':'times'}.`;});
</script></body></html>
